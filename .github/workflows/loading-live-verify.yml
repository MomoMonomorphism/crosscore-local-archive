name: Verify loading feedback against live Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/loading-live-verify.yml'
      - 'web/check-loading-live.mjs'
      - 'web/src/SpineStage.tsx'
      - 'web/src/SpineStageRenderer.tsx'
      - 'web/src/CharacterPortraitStage.tsx'
      - 'web/src/ResourceLoadingNotice.tsx'
      - 'web/src/ThumbnailLoadingFeedback.tsx'
      - 'web/src/resourceLoading.css'
  workflow_dispatch:
    inputs:
      mode:
        description: Verify the published build
        type: choice
        options: [published]
        default: published
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LIVE_BASE_SHA: 97a83887f6e4192990bca7210d5118fb32116337
      VERIFY_MODE: published
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install project dependencies
        working-directory: web
        run: npm ci
      - name: Build the current Pages commit
        working-directory: web
        env:
          VITE_BASE_PATH: /crosscore-local-archive/
        run: npm run build:pages
      - name: Install browser verification tooling
        working-directory: web
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Check actual Pages bundles and current ready-state UI
        run: |
          mkdir -p .scratch/live-verification .scratch/site-after
          ln -s "$PWD/dist-pages" .scratch/site-after/crosscore-local-archive
          python -m http.server 4173 --bind 127.0.0.1 --directory .scratch/site-after > .scratch/live-verification/after-server.log 2>&1 &
          AFTER_PID=$!
          trap 'kill "$AFTER_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/crosscore-local-archive/ > /dev/null; then break; fi
            sleep 1
          done
          cd web
          node check-loading-live.mjs
      - name: Upload live comparison and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loading-live-${{ env.VERIFY_MODE }}
          path: .scratch/live-verification/
          if-no-files-found: warn
          retention-days: 7
